[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "anthropic>=0.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"
