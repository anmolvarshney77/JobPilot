<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Apply - Lever</title></head>
<body>
<form class="application-form">
  <div class="application-question"><label>Full name</label><input name="name" type="text"></div>
  <div class="application-question"><label>Email address</label><input name="email" type="email"></div>
  <div class="application-question"><label>Phone</label><input name="phone" type="tel"></div>
  <div class="application-question"><label>Current company</label><input name="org" type="text"></div>
  <div class="application-question"><label>LinkedIn URL</label><input name="urls[LinkedIn]" type="url"></div>
  <div class="application-question">
    <label>Are you legally authorized to work in the United States?</label>
    <select name="eeo[authorized]">
      <option value="">--</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </div>
  <div class="application-question">
    <label>Do you require employer sponsorship for a work visa?</label>
    <select name="eeo[sponsorship]">
      <option value="">--</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
