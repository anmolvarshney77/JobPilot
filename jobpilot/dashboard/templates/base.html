<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPilot {% block title %}{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         font-size: 14px; color: #1a1a1a; background: #f5f5f5; }
  nav { background: #1a1a2e; color: #fff; padding: 12px 24px;
        display: flex; gap: 24px; align-items: center; }
  nav a { color: #ccc; text-decoration: none; font-size: 14px; }
  nav a:hover, nav a.active { color: #fff; }
  nav .brand { font-weight: 700; font-size: 16px; color: #fff; margin-right: 16px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  th { background: #f0f0f0; text-align: left; padding: 10px 12px;
       font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #555; }
  td { padding: 10px 12px; border-top: 1px solid #eee; vertical-align: top; }
  tr:hover td { background: #fafafa; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px;
           font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .badge-new { background: #dbeafe; color: #1d4ed8; }
  .badge-shortlisted { background: #d1fae5; color: #065f46; }
  .badge-prepared { background: #ede9fe; color: #5b21b6; }
  .badge-applied { background: #fef3c7; color: #92400e; }
  .badge-filtered_out { background: #fee2e2; color: #991b1b; }
  .badge-closed { background: #f3f4f6; color: #6b7280; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 4px; cursor: pointer;
         font-size: 13px; font-weight: 500; border: none; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-sm { padding: 3px 10px; font-size: 12px; }
  .alert-red { background: #fee2e2; border-left: 4px solid #dc2626;
               padding: 12px 16px; margin-bottom: 16px; border-radius: 4px; color: #991b1b; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
                border: 1px solid #ddd; background: #fff; }
  .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
          padding: 16px; margin-bottom: 16px; }
  pre { background: #f8f8f8; padding: 12px; border-radius: 4px; white-space: pre-wrap;
        font-size: 13px; border: 1px solid #e5e7eb; }
  select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<nav>
  <span class="brand">JobPilot</span>
  <a href="/">Jobs</a>
  <a href="/follow-ups">Follow-ups</a>
  <a href="/stats">Stats</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
